services:
  database:
    image: postgres:16
    container_name: monolith-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopuser
      POSTGRES_PASSWORD: shoppassword
      POSTGRES_DB: shopdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: monolith-shop-api:1.0
    container_name: monolith-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: shopuser
      DB_PASSWORD: shoppassword
      DB_NAME: shopdb
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - database

volumes:
  postgres_data:
